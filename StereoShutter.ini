; StereoShutter 0.18.83 - settings
; Edit while StereoShutter is closed. Changes apply at the next start.
; Each setting is explained above it. A line that is missing takes the program's standard value.
; The manual explains them all: StereoShutter_Manual_EN.pdf ("The StereoShutter.ini file").
;
; Display mode is selected from the monitor and its Windows refresh rate:
;   recognized 3D Vision mode: NVIDIA timing table, with optional LightBoost;
;   other displays at 198-370 Hz: an image, then a black refresh, for each eye;
;   other displays at 99-185 Hz: one refresh per eye;
;   other rates: unsupported, so the glasses do not start.
; The glasses' values are saved per monitor, resolution, refresh rate and situation (StereoShutter's
; own window or over a game, with or without HDR), in %LOCALAPPDATA%\StereoShutter\monitors.json.
;
; StereoShutter writes into this file what is saved (Ctrl+Alt+Enter, the HDR panel, "Settings for
; this game") and, by itself, help_at_start = never after the first start, and queue_auto_start and
; engine_auto_start when queue = auto or engine = auto had to change for this game. Before writing
; those two, or the setup assistant's H, it keeps a copy of this file next to it
; (StereoShutter.ini.*-backup-*.bak).

[Output]
; glasses = use the emitter; image_only = the picture without the emitter (to check it).
mode = glasses
; The glasses' monitor: primary, surround (an NVIDIA Surround grid), part of the name Windows
; gives it, or its Windows display (DISPLAY2).
monitor = primary
; Images prepared ahead: auto, or a fixed 2 to 8. auto starts at 3 and adds one each time the
; graphics card does not have StereoShutter's images ready in time (up to 6); what it adds is
; written as queue_auto_start for this game's next starts (delete that line to start at 3 again).
; More: more margin, but the picture reaches the screen a little later. It does not set the
; game's frame rate.
queue = auto
; How StereoShutter's image reaches the screen at every refresh: draw = drawn by its DirectX 11
; device; copy = each image drawn only when it changes, then copied at every refresh by a
; DirectX 12 queue of high priority that the graphics card serves by itself, whatever the game
; keeps it busy with. auto = draw, and copy for the rest of the session once draw cannot keep
; StereoShutter's images on time even at GPU priority 17 (a game that fills the graphics card and
; makes very few frames a second); it says so in red, and writes engine_auto_start = copy so
; that this game's next starts begin with copy (delete that line to start with draw again). Copy
; costs the game a little, which is why auto starts with draw. If copy cannot start, or loses
; its DirectX 12 device while running, draw is used and the report says why.
engine = auto
; HDR eye images kept to be copied again: auto, yes or no. auto: only with copy, which copies
; from them; with draw each eye image is drawn straight into the swap chain.
final_cache = auto
; The GPU priority of StereoShutter's own device, -7 to 7 (0 = normal). Only its own device and
; only while it runs.
gpu_priority = 7
; An absolute GPU priority instead: off, 16, 17 or auto. 16 is the level Windows gives the game
; in front: StereoShutter's work waits for the game's current job. At 17 Windows interrupts the
; game's work for StereoShutter's, which costs the game frames. auto = 16, and 17 only while an
; image of StereoShutter's has waited on the graphics card more than 60 % of its queue's time,
; back to 16 once its images are done early again; the report says when. Never a priority for
; the game. engine = auto needs auto or 17 here.
gpu_priority_absolute = auto
; output = the absolute priority for the output device only; pipeline = also for the device that
; copies the game's picture (katanga_acquire / pair_acquire = async). If Windows does not take
; it, both go back to the relative priority for the session.
gpu_priority_scope = pipeline
; StereoShutter's priority class on the graphics card: high or normal (never realtime).
gpu_priority_class = high
; The processor's priority while it shows the game: max (StereoShutter high, and the thread that
; makes its images in Windows' scheduler for sound and video), time_critical (only that thread)
; or normal. Only StereoShutter, only while it runs.
cpu_priority = max
; The FPS counter at the top left (the game's frames and StereoShutter's images per second):
; yes = shown from the start; no = only with its key (Ctrl+Alt+F).
fps_counter = yes
; Over a game: no = a layer inside the game's window; yes = a window of StereoShutter's own over
; the game's (independent flip then depends on Windows and the driver). Not the same as [Host]
; fullscreen_compat.
own_window = no
; The other monitors covered in black while the 3D runs: no, others, or a list of Windows
; display numbers or parts of names (2, 3). The glasses' monitor is never covered. A video may
; keep playing behind a cover: pause it.
cover_monitors = no
; NVIDIA Reflex on StereoShutter's own device: status = only the driver's read-only status, once
; a second; yes = Reflex on (low latency mode, maximum clocks, markers); no = no Reflex calls.
; Only StereoShutter's device, off again at the end.
reflex = status
; StereoShutter's own program profile in NVIDIA's settings, for StereoShutter.exe only: it holds
; what the global settings would get wrong for it (low latency mode, frame rate limits, vertical
; sync, power management) and nothing else. Global settings and game profiles are not changed.
; yes = kept as needed at every start; no = never touched.
nvidia_profile = yes
; HDR output on an HDR monitor: brighter pictures through the glasses. If Windows HDR is off for
; that monitor, StereoShutter switches it on while it runs and off at the end. The setup
; assistant offers it (H) on an HDR monitor. Independent of [Input] picture.
hdr = no
; HDR brightness: the pictures' white in times Windows' SDR white, 1 to 8, never above the
; monitor's peak. Ctrl+Alt+PageUp/PageDown change it; Ctrl+Alt+Enter saves it. For a game's own
; HDR, a lower value leaves more room for its bright parts.
hdr_brightness = 3
; HDR output encoding: scrgb (16-bit float) or hdr10 (10-bit PQ/BT.2020). The output only, not
; how the game's picture is read.
hdr_format = scrgb
; The HDR panel's settings (Alt+Shift+F10). SDR-to-HDR curve: 2.2, srgb, or 1.6 to 3.0.
hdr_gamma = 2.2
; Saturation, 0.5 to 2.0 (1.0: unchanged).
hdr_saturation = 1.0
; Highlights: soft (a soft knee into the monitor's peak) or clip.
hdr_highlights = soft
; Scene controls: auto = the neutral value in brackets.
; Exposure: -4 to 4 EV (0). Midtones and contrast: 0.5 to 2 (1).
hdr_exposure = auto
hdr_midtones = auto
hdr_contrast = auto
; Shadows: -1 to 1 (0). Highlight knee: 0.1 to 0.9 (0.5).
hdr_shadows = auto
hdr_highlight_knee = auto
; Gain of each colour: 0.25 to 4 (1).
hdr_red_gain = auto
hdr_green_gain = auto
hdr_blue_gain = auto
; Paper white: auto or 80 to 1000 nits. Peak: auto or 80 to 10000 nits. auto takes Windows' and
; the monitor's values; a number must suit the monitor.
hdr_paper_white_nits = auto
hdr_peak_nits = auto

; The HDR panel's two looks: [HDR.SDR] for games without HDR, [HDR.Native] for games in HDR.
; They take the fourteen HDR panel settings above; whatever is missing comes from [Output]. The
; panel writes them when it saves.
[HDR.SDR]

[HDR.Native]

[Input]
; What is shown: auto = over a game its 3D picture (black until it comes; the test pattern if it
; takes more than 2 s), and the pattern in StereoShutter's own window; pattern = always the
; pattern; game = the game's picture in StereoShutter's own window too.
source = auto
; What the game's picture is: auto, sdr, hdr10 or scrgb. auto uses the game's colour space and
; the format (a 10-bit picture alone is not taken for HDR). By hand only when the colours come
; out wrong, and only with what the game really sends. Ctrl+Alt+H chooses Auto or HDR10 for this
; session only, without changing this line.
picture = auto
; The doorman: StereoShutter asks the game's layer or StereoShutter_host.dll for one game frame
; per cycle of the glasses, in step with them. auto = StereoShutter decides: one frame per cycle
; while the game keeps up, one every two cycles when it keeps up with half of them, and free when
; it cannot do even that; with one refresh per eye, always. yes = always; no = never (the game at
; its own pace). A late frame is never held back.
pace_game = auto
; How far ahead of its moment each frame should be ready, in ms: 0 = half a cycle; or 0.5 to 10.
pace_lead_ms = 0
; yes = that lead then follows when the game's frames come (longer while they come too close,
; shorter while they come early enough), from pace_lead_ms (with 0: 5.5 ms) up to 3/4 of a
; cycle; no = it stays at pace_lead_ms.
pace_lead_auto = yes
; With pace_game = yes: one game frame every N cycles, 1 to 4 (2 for a game that cannot keep up:
; an even pace, but what moves may look doubled).
pace_divider = 1
; Which game frame each eye shows: same_frame = both eyes of a cycle from the same frame;
; newest = each eye the newest frame (no doorman then); auto = chosen with pace_game.
eyes = same_frame
; How the picture comes from a game layer with a live texture: live (as the layer draws it) or
; pairs (its complete pairs, a little later). Older layers have only pairs.
link = pairs
; geo-11's Katanga channel: auto (with StereoShutter_host.dll, or when no layer host is there),
; no, or yes (only that channel). geo-11 needs direct_mode = katanga_vr (the geo-11 setup).
katanga = auto
; Which eye is in each half of geo-11's picture: right_left (the right eye in the left half, as
; geo-11 hands it over) or left_right. "Settings for this game" changes it.
katanga_eyes = right_left
; How the game's picture is taken: async = copied on a device of StereoShutter's own (geo-11's
; channel: katanga_acquire; a layer's pairs: pair_acquire); direct = read where it is;
; direct_guarded = direct, with both eyes of a pair kept together.
katanga_acquire = async
pair_acquire = direct_guarded
; Where in the cycle geo-11's new pictures land is measured on the graphics card, and the
; schedule moved to it: auto, yes or no.
katanga_phase_probe = auto
; Without StereoShutter_host.dll: which window is the game's, by its .exe name or part of its
; title (Game.exe); empty = the window in front when the picture comes.
game_window =
; For older games that switch their HDR on through NVIDIA's driver (no colour space call the
; host DLL sees): whether the driver's HDR state counts for reading the game's picture.
; auto = once it changes during the run, or while Windows HDR is off; yes = whenever it says HDR;
; no = not read while playing (only at the start, for the report). no for a game that does not
; need it: the read is once a second, and a slow driver can make it wait.
nvapi_hdr = auto
; The test pattern: depth (the floating rectangle), bars (crosstalk bars) or colors (red for the
; left eye, blue for the right).
pattern = depth

[Monitor]
; Read the monitor's ELMB state (DDC/CI) at the start and at the end.
read_elmb = yes
; yes = ELMB off and on at the start, and with Ctrl+Alt+R. It changes the monitor.
relatch_elmb = no
; max = the monitor's brightness at its maximum while StereoShutter runs (DDC/CI), back at the
; end; keep = not touched. With HDR, it is raised before Windows HDR is switched on.
brightness = max
; NVIDIA's 3D Vision monitor table is read from the emitter driver's registry entries. An
; optional JSON copy of it next to this file adds only monitors the registry table lacks; none =
; no such file is looked for. No NVIDIA table comes with StereoShutter.
nvidia_table = StereoShutter_nvtimings.json
; Where the glasses' values are saved: auto = %LOCALAPPDATA%\StereoShutter\monitors.json, shared
; by every game folder; a file name (next to this file) or a full path = that file.
profiles = auto
; LightBoost on a 3D Vision monitor of NVIDIA's table, at one of its modes: switched on for the
; session and put back at the end. no = the monitor's timing is not changed.
lightboost = yes
; LightBoost in NVIDIA Surround: auto = with the timings prepared once by
; StereoShutter_LightBoost_Surround_Setup, on while playing and the grid's previous signal back at
; the end; no = the grid is left as it is; try = NOT RECOMMENDED: a direct trial on the active
; grid, which can hang or restart the computer.
lightboost_surround = auto

[Emitter]
; Starting values for a monitor with nothing saved and no NVIDIA mode. Run StereoShutter_Setup:
; what is saved wins. The glasses always follow the monitor's real refresh rate.
timing_source = manual
rate_hz = 180.000
open_delay_us = 1
open_duration_us = 2780
w_us = 0
sync_offset_us = 1
; Kept for older files; it changes nothing.
exact_rate = yes
; The first eye command only once the picture runs steadily.
clean_start = yes
; Eyes swapped from the start (what is saved for each monitor wins).
swap_eyes = no
; Switch the emitter off at the end. The stop key and the game's end are also watched apart from
; the drawing, so that the emitter is switched off even if the picture is stuck.
disable_on_exit = yes

[BFI]
; With an image and a black refresh per eye: black = image, black; double = the image twice
; (worse in the tests).
mode = black
; Refreshes per eye: 3 = the image twice, then black (at 360 Hz, 60 cycles a second, glasses at
; 120 Hz), the steadier; 2 = image, black (at 360 Hz, 90 cycles a second, glasses at 180 Hz),
; smoother for a game that keeps 90 frames a second. 3 needs 297 to 370 Hz; elsewhere 2 is used
; (at 240 Hz, 60 cycles). The glasses' values for 3 and for 2 are saved apart; with nothing
; saved for 3, those of 2 are carried over. "Settings for this game" changes it (Glasses cycles).
refreshes_per_eye = 3
; Optional starting values for image and black, for a monitor with nothing saved:
; sync_offset_us = 1
; open_duration_us = 2780
; swap_eyes = no

[Display]
; The language of the texts: auto (Windows' language), en, es, it, fr, de, pt or ru. The setup
; assistant's L key changes it.
language = auto
; The mouse in the HDR panel and the settings panel: auto or yes; no = keyboard only.
hdr_panel_mouse = auto
; How far the panels stand out of the screen, in % of an eye's width: 0 (at the screen) to 2.
hdr_panel_depth = 0.4

[Test]
; How long the test pattern lasts when StereoShutter.exe is opened on its own, 1 to 3600 seconds.
; StereoShutter_Test always lasts 10 minutes.
seconds = 10

[Report]
; A report of each session in StereoShutter_reports, next to the program, and
; StereoShutter_host.log next to the DLL. The setup assistant and the pattern test always write
; theirs. To report a problem, StereoShutter_Feedback records one game session with everything
; needed, whatever this says.
enabled = no

[Timing]
; With [Output] reflex = yes: whether Reflex's low latency mode is asked for.
reflex_low_latency = yes

[Diagnostics]
; Very detailed timing data, only for tracking down a problem.
temporal_trace = no
; With engine = copy: DirectX 12's debug layer (Windows' Graphics Tools), only for a test.
dx12_debug_layer = no
; A picture check of geo-11's channel with Ctrl+Alt+Shift+F8, only for a test.
source_hold_probe = no

[Keys]
; Keys anywhere in Windows while StereoShutter runs. Empty or none: no key.
; Written like Ctrl+Alt+S, Shift+F12, NumPlus. Names: Left, Right, Up, Down, Home, End, PageUp,
; PageDown, Insert, Delete, Enter, Space, Pause, Tab, Backspace, NumPlus, NumMinus, F1-F24,
; Num0-Num9. A key without Alt (Ctrl+T) is taken only while the game or StereoShutter is in front.
toggle_3d = Ctrl+T
relock = Ctrl+Alt+G
swap_eyes = Ctrl+Alt+S
phase_minus = Ctrl+Alt+Left
phase_plus = Ctrl+Alt+Right
open_plus = Ctrl+Alt+Up
open_minus = Ctrl+Alt+Down
save = Ctrl+Alt+Enter
; The keys page, then "Settings for this game", the quick setup and back to the game.
help = Ctrl+Alt+K
; The keys page at the start over a game: once (then StereoShutter writes never), always or never.
help_at_start = once
; Marks a moment in the report. The game session recorded by StereoShutter_Feedback uses
; Ctrl+Alt+F9 when this is none.
mark = none
; Stop StereoShutter without closing the game.
quit = Ctrl+Alt+F12
fps_counter = Ctrl+Alt+F
hdr_brighter = Ctrl+Alt+PageUp
hdr_darker = Ctrl+Alt+PageDown
; Over a game: the game's picture read as Auto or HDR10, this session only. It does not switch
; Windows HDR, the output or the game's HDR, and is not saved.
input_picture = Ctrl+Alt+H
; The HDR panel, and its keys while it is open.
hdr_panel = Alt+Shift+F10
hdr_panel_prev = Ctrl+Alt+I
hdr_panel_next = Ctrl+Alt+M
hdr_panel_minus = Ctrl+Alt+J
hdr_panel_plus = Ctrl+Alt+L
hdr_panel_reset = Ctrl+Alt+Backspace
; Only with [Monitor] relatch_elmb = yes.
elmb = Ctrl+Alt+R
; How much each press of the phase and open time keys moves, 1 to 1000 us (with Shift, ten times).
phase_step_us = 10
open_step_us = 10

[Host]
; StereoShutter_host.dll, in games with geo-11 (the geo-11 setup connects it).
; Start StereoShutter with the game, before the game makes its picture (so that Windows HDR is
; ready first). no = start it by hand (StereoShutter_Play).
autostart = yes
; Tell StereoShutter when the game declares its picture's colour space (its own HDR).
color_space_hook = yes
; Count the game's frames and act as the doorman. no = if a game closes at the start (then give
; the game its own FPS limit).
pace_hook = yes
; While StereoShutter's picture covers the game's window completely, Windows stops reporting the
; game's frames as shown, and games that wait for that crawl. yes = they get the answer for a
; window in view; no = Windows' own answer.
frame_statistics = yes
; Pixels at the left edge of the game's window where the game's own picture stays visible
; (0 = none). auto = none, and 1 px if the game still makes only a few frames a second while
; covered; a loading screen or a pause can be taken for that, and with a strip Windows composes
; StereoShutter's picture (flicker). Keep 0 unless a game crawls.
visible_game_strip = 0
; For games that ask for exclusive full screen: a borderless window over the monitor instead,
; with DXGI kept windowed. Off unless a game needs it.
fullscreen_compat = no
; NVIDIA HDR routing for games that need it; only with [Output] monitor = primary.
nvapi_hdr_route = no
; With that routing: the main monitor first when the first one listed is not active.
nvapi_primary_first = no
; geo-11's load_library_redirect, which geo-11 turns off when a DLL is chained after it, done by
; StereoShutter_host.dll instead. The geo-11 setup sets yes where the fix has it on.
geo11_load_redirect = no

; Sections for one monitor or one refresh rate
; A section with @ and a monitor and/or a refresh rate replaces the lines of the plain section
; when that is the monitor in use:
;   [Output @ 120 Hz]          the monitor is at 120 Hz (within 1 %)
;   [Output @ DISPLAY2]        Windows' DISPLAY2, or a part of the monitor's name
;   [Input @ DISPLAY2 360 Hz]  both
; If several apply, the last one in the file wins; the command line wins over them. What
; StereoShutter writes goes to the section the value came from. They cannot change what is needed
; before the monitor is known: [Output] monitor and own_window, [Input] katanga and game_window,
; [Monitor] profiles and nvidia_table, and the [Display], [Report] and [Host] sections.
;
; Example: HDR output at 360 Hz only (remove the ; of both lines):
; [Output @ 360 Hz]
; hdr = yes
